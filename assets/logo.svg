<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Windows App Restarter</title>
  <desc id="desc">A monitor with a circular restart arrow on a blue rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="24" x2="216" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="screen" x1="78" y1="76" x2="178" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#background)"/>
  <g filter="url(#shadow)">
    <rect x="50" y="66" width="156" height="104" rx="18" fill="#ffffff"/>
    <rect x="64" y="80" width="128" height="76" rx="10" fill="url(#screen)"/>
    <rect x="113" y="169" width="30" height="24" rx="5" fill="#ffffff"/>
    <rect x="88" y="192" width="80" height="16" rx="8" fill="#ffffff"/>
  </g>

  <path d="M161 108a35 35 0 1 0-10 39" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round"/>
  <path d="M158 84v33h32" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="128" cy="119" r="10" fill="#1e3a8a"/>
</svg>
